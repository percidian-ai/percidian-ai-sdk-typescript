name: Release
# Publishes this SDK to npm as `percidian`, at the version package.json carries. Run by hand only (Actions > Release > Run
# workflow), never on a push, pull request or tag. With publish off it only builds, tests and packs the package (the run's
# `packages` artifact). With publish on, and on main only, the npm job waits in the `npm` environment for approval and publishes
# by trusted publishing: a short-lived OIDC token for this run, no stored token, and npm adds provenance (public repository).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (main only); off, it only builds, tests and packs
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Build, tests and package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --pack-destination "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
  # Checks nothing out and runs no code of the repository's: only the built package reaches the OIDC token.
  npm:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/percidian
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      # Trusted publishing needs npm 11.5.1 and Node 22.14.0 or later: Node 24 carries npm 11.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm publish packages/*.tgz
